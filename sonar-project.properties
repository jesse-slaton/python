# SonarQube Project Configuration
# Documentation: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project identification
sonar.projectKey=python-utilities
sonar.projectName=Python Utilities
sonar.projectVersion=0.1.0

# Source code location
sonar.sources=.
sonar.exclusions=**/tests/**,**/__pycache__/**,**/venv/**,**/env/**,**/build/**,**/dist/**,**/*.egg-info/**,.git/**

# Test location
sonar.tests=tests
sonar.test.inclusions=**/*_test.py,**/test_*.py

# Python-specific settings
sonar.python.version=3.12

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Additional analysis parameters
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json
