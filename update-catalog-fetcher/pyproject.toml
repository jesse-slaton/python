[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "update-catalog-fetcher"
version = "0.1.0"
description = "Fetch Windows updates from Microsoft Update Catalog and generate Tanium Deploy packages"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Jesse Slaton", email = "jesse-slaton@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
update-catalog-fetcher = "update_catalog_fetcher.cli:main"

[project.urls]
Repository = "https://github.com/jesse-slaton/python"
Issues = "https://github.com/jesse-slaton/python/issues"

[tool.setuptools]
packages = ["update_catalog_fetcher"]

[tool.ruff]
# Inherit the repo-wide rule set (including S) from the root pyproject.toml;
# only the interpreter floor differs for this project.
extend = "../pyproject.toml"
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
