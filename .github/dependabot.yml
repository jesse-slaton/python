version: 2
updates:
  - package-ecosystem: pip
    # One entry at the repo root: Dependabot scans every requirements*.txt
    # below it, so per-subdirectory entries opened duplicate PRs.
    #
    # NOT covered, on purpose: the uv-compiled CI hash locks under
    # .github/ci-requirements/ (and the uv pin in .github/ci-tools/). This
    # entry fetches only the root plus one level of subdirectories, and a
    # directory entry for the locks would regenerate them with pip-tools'
    # pip-compile (no --universal), breaking the markers and failing the
    # freshness check. Bumps are manual: DEVELOPMENT.md, "Updating CI tool
    # pins". A bump here to a file a lock includes via -r (the two project
    # requirements.txt files) fails the Lint job's lock-freshness step until
    # the PR also carries `bash scripts/check-ci-locks-fresh.sh --write` (and,
    # if the new version was uploaded after the script's EXCLUDE_NEWER
    # timestamp, a commit advancing that timestamp).
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - dependencies
    open-pull-requests-limit: 10
    # Packages that must move together: pytest plugins track pytest's major,
    # textual pins a rich range, and the sphinx theme tracks sphinx.
    groups:
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      textual-rich:
        patterns:
          - "textual"
          - "rich"
      sphinx:
        patterns:
          - "sphinx"
          - "sphinx-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    # Sub-actions of one repo share a commit SHA, but Dependabot names each
    # subpath as its own dependency and may bump one and not the rest. A split
    # codeql-action makes init/analyze refuse each other's config and fails every
    # CodeQL job, so the family moves in one PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Every other action in one PR: several share release.yml, so separate
      # PRs conflict with each other after each merge.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
