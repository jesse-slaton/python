name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check: `Lint`.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.4

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  # Typecheck is reported but NOT required (strict mypy debt is tracked separately).
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check mypy==2.4.1 \
            types-requests==2.33.0.20261030 \
            -r update-catalog-fetcher/requirements.txt \
            -r packagemanager-tui/requirements.txt

      # Ratchet: the repo carries a known mypy backlog (#19). Fail only when
      # the error count rises above the baseline; lower MYPY_BASELINE as #19
      # burns it down, and replace this with a plain `mypy .` at zero.
      - name: Mypy
        env:
          MYPY_BASELINE: "11"
        run: |
          set -uo pipefail
          mypy . | tee mypy.log || true  # exit code judged by the count below
          # A crash or config error prints no summary line; never read that as 0 errors.
          if ! grep -qE '^(Found [0-9]+ errors? in|Success: no issues found)' mypy.log; then
            echo "::error::mypy did not produce a result summary"
            exit 1
          fi
          count=$(grep -c ': error:' mypy.log || true)
          echo "mypy errors: ${count} (baseline ${MYPY_BASELINE})"
          if [ "${count}" -gt "${MYPY_BASELINE}" ]; then
            echo "::error::mypy errors rose from ${MYPY_BASELINE} to ${count}"
            exit 1
          fi

  test-leg:
    name: Test leg (update-catalog-fetcher, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor (matches the root requires-python); 3.14 is
        # the newest stable release with broad wheel support.
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: update-catalog-fetcher
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # pytest exits 5 when it collects no tests, which fails the step on purpose.
      - name: Pytest
        working-directory: update-catalog-fetcher
        run: python -m pytest

  # Required check: `Test`. Summary of every leg; fails unless all succeeded.
  test:
    name: Test
    if: always()
    needs: [test-leg]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every test leg to succeed
        env:
          LEG_RESULT: ${{ needs.test-leg.result }}
        run: |
          echo "test-leg: ${LEG_RESULT}"
          [ "${LEG_RESULT}" = "success" ]

  # Required check: `Security`.
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: python -m pip install --disable-pip-version-check "bandit[toml]==1.9.4" pip-audit==2.10.1

      # -c pyproject.toml reads [tool.bandit]; -ll reports medium severity and up.
      - name: Bandit
        run: bandit -c pyproject.toml -r . -ll

      - name: Audit dependencies (pip-audit)
        run: |
          set -euo pipefail
          for req in requirements-dev.txt \
                     packagemanager-tui/requirements.txt \
                     update-catalog-fetcher/requirements.txt \
                     update-catalog-fetcher/requirements-dev.txt; do
            echo "::group::pip-audit ${req}"
            pip-audit -r "${req}"
            echo "::endgroup::"
          done

      - name: Zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Findings must FAIL this required check: with advanced-security the
          # action uploads SARIF and never fails the job.
          advanced-security: "false"
          annotations: "true"
