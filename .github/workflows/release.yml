name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # softprops/action-gh-release creates the release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd packagemanager-tui
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          cd packagemanager-tui
          pyinstaller build.spec

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create Release
        # Pinned to the commit the former @v1 tag pointed at (v0.1.15), so release behavior is unchanged.
        # Swapping to `gh release` is a behavior change, out of scope for the baseline.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 # zizmor: ignore[superfluous-actions]
        with:
          files: packagemanager-tui/dist/packagemanager-tui.exe
          body: |
            Package Manager TUI ${{ steps.get_version.outputs.VERSION }}

            ## Installation
            Download `packagemanager-tui.exe` and run it.

            ## Updates
            Run with `-U` flag to update: `packagemanager-tui.exe -U`

            ## Changes
            See commit history for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
