name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd packagemanager-tui
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          cd packagemanager-tui
          pyinstaller build.spec

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: packagemanager-tui/dist/packagemanager-tui.exe
          body: |
            Package Manager TUI ${{ steps.get_version.outputs.VERSION }}

            ## Installation
            Download `packagemanager-tui.exe` and run it.

            ## Updates
            Run with `-U` flag to update: `packagemanager-tui.exe -U`

            ## Changes
            See commit history for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
