name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # softprops/action-gh-release creates the release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Hash-locked: TUI requirements + pyinstaller (.github/ci-requirements/release.in).
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci-requirements/release.txt

      - name: Build executable
        run: |
          cd packagemanager-tui
          pyinstaller build.spec

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create Release
        # SHA-pinned to v2.6.2 (moved from the v1 line by the Dependabot actions group, #27).
        # Swapping to `gh release` is a behavior change, out of scope for the baseline.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.6.2 # zizmor: ignore[superfluous-actions]
        with:
          files: packagemanager-tui/dist/packagemanager-tui.exe
          body: |
            Package Manager TUI ${{ steps.get_version.outputs.VERSION }}

            ## Installation
            Download `packagemanager-tui.exe` and run it.

            ## Updates
            Run with `-U` flag to update: `packagemanager-tui.exe -U`

            ## Changes
            See commit history for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
