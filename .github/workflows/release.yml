name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # softprops/action-gh-release creates the release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Release gate: re-audit every CI lock with Windows markers at tag time
      # (the same audit as CI's security-windows job, which runs on every PR).
      # pip-audit comes from the hash-locked security lock, in its own venv so
      # it never mixes with the build env.
      - name: Audit CI locks (pip-audit, Windows markers)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/audit-venv"
          audit_py="${RUNNER_TEMP}/audit-venv/Scripts/python.exe"
          "${audit_py}" -m pip install --disable-pip-version-check --require-hashes -r .github/ci-requirements/security.lock
          for lock in .github/ci-requirements/*.lock .github/ci-tools/lock-tools.lock; do
            echo "::group::pip-audit ${lock}"
            "${audit_py}" -m pip_audit --disable-pip --require-hashes -r "${lock}"
            echo "::endgroup::"
          done

      - name: Install dependencies
        # Hash-locked: TUI requirements + pyinstaller (.github/ci-requirements/release.in).
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci-requirements/release.lock

      - name: Build executable
        run: |
          cd packagemanager-tui
          pyinstaller build.spec

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create Release
        # SHA-pinned to v2.6.2 (moved from the v1 line by the Dependabot actions group, #27).
        # Swapping to `gh release` is a behavior change, out of scope for the baseline.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.6.2 # zizmor: ignore[superfluous-actions]
        with:
          files: packagemanager-tui/dist/packagemanager-tui.exe
          body: |
            Package Manager TUI ${{ steps.get_version.outputs.VERSION }}

            ## Installation
            Download `packagemanager-tui.exe` and run it.

            ## Updates
            Run with `-U` flag to update: `packagemanager-tui.exe -U`

            ## Changes
            See commit history for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
