name: CodeQL

# Template. Render with:
#   python3 render.py --set default_branch=<branch> common/codeql.yml <out>
# then edit `language:` to the repo's CodeQL languages (always keep `actions`).
# No `paths`/`paths-ignore` and no job-level `if:` anywhere in this workflow:
# every `Analyze (<language>)` job is a required check and must always report.

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter: a stacked PR must run the same required checks.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload CodeQL results to code scanning
      contents: read # checkout
      actions: read # CodeQL reads workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
